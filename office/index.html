<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Order book — The Qala</title>
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Karla:wght@400;500;600;700&family=Tiro+Devanagari+Marathi&display=swap">
<style>
:root{
  --ground:#FAF3EB; --panel:#FFFBF6; --panel-2:#F1E5D6;
  --ink:#2A1A14; --ink-2:#7A6152; --line:#E7D6C2; --line-2:#CDB79B;
  --accent:#7E1226; --gold:#9A7325; --gold-2:#CFA84F;
  --shadow:rgba(74,42,14,.10); --wash-gold:rgba(207,168,79,.16);
  --new:#7E1226; --confirmed:#9A7325; --sent:#2F6E5B; --done:#4B5A66; --cancelled:#8A8A8A;
  --deleted:#B0A79F;
  --on-accent:#FFF6E9;
}
@media (prefers-color-scheme:dark){
  :root{
    --ground:#131011; --panel:#1C1719; --panel-2:#272023;
    --ink:#F3E8D8; --ink-2:#B29C8B; --line:#3A2E33; --line-2:#5A484F;
    --accent:#E0BC72; --gold:#CFA84F; --gold-2:#E0BC72;
    --shadow:rgba(0,0,0,.4);
    --new:#E0BC72; --confirmed:#CFA84F; --sent:#7FC0A8; --done:#9DB0BD; --cancelled:#8A8A8A;
    --deleted:#6E645E;
    --on-accent:#131011;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:Karla,"Segoe UI",system-ui,sans-serif;font-size:15px;line-height:1.5;
  -webkit-text-size-adjust:100%}
h1,h2{font-family:Marcellus,Georgia,serif;font-weight:400;margin:0;line-height:1.15}
a{color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}

header{border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:20}
header[hidden]{display:none}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 0}
.bar h1{font-size:1.35rem}
.bar .who{margin-left:auto;font-size:.8rem;color:var(--ink-2);
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crossnav{display:flex;align-items:center;gap:4px;font-size:.82rem}
.crossnav a,.crossnav span{padding:5px 11px;border-radius:999px;text-decoration:none;
  color:var(--ink-2);border:1px solid transparent}
.crossnav a:hover{border-color:var(--line-2);color:var(--ink)}
.crossnav span[aria-current]{background:var(--panel-2);color:var(--ink);font-weight:600}
.bar .out{border:1px solid var(--line);background:transparent;color:var(--ink-2);
  padding:5px 12px;border-radius:999px;font:inherit;font-size:.78rem;cursor:pointer}
.bar .out:hover{border-color:var(--accent);color:var(--accent)}
@media (max-width:560px){ .bar{gap:8px} .bar .who{margin-left:auto;flex:0 1 auto} }
.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--ink-2);
  padding:7px 14px;border-radius:999px;font:inherit;font-size:.85rem;cursor:pointer;white-space:nowrap}
.tab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tab b{font-weight:600}

.tools[hidden]{display:none}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:16px 0 4px}
input[type=search]{flex:1 1 200px;min-width:0;padding:9px 12px;border:1px solid var(--line);
  border-radius:10px;background:var(--panel);color:inherit;font:inherit}
.btn{border:1px solid var(--line-2);background:var(--panel);color:var(--ink);
  padding:9px 14px;border-radius:10px;font:inherit;font-size:.85rem;cursor:pointer;text-decoration:none;
  display:inline-block}
.btn:hover{border-color:var(--gold)}
.btn.go{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.go:hover{border-color:var(--accent);opacity:.9}

/* where an order came from, when it did not come from the website */
.tag{display:inline-block;border:1px solid var(--line-2);border-radius:999px;
  padding:1px 8px;font-size:.66rem;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--gold);vertical-align:1px;white-space:nowrap}
.tag.whatsapp{color:var(--sent);border-color:var(--sent)}
.tag.instagram{color:var(--accent);border-color:var(--accent)}

.note{margin:18px 0;padding:14px 16px;border:1px solid var(--line);border-left:3px solid var(--gold);
  border-radius:10px;background:var(--panel);font-size:.9rem}
.note.bad{border-left-color:var(--accent)}
.note h2{font-size:1rem;margin-bottom:6px}
.note code{background:var(--panel-2);padding:1px 5px;border-radius:4px;font-size:.85em}

/* ---------- the way in ---------- */
.gate{max-width:380px;margin:0 auto;padding:56px 0 80px;text-align:center}
.gate .mr{font-family:"Tiro Devanagari Marathi",serif;font-size:2rem;color:var(--accent);display:block}
.gate h1{font-size:1.6rem;margin:10px 0 6px}
.gate p.sub{color:var(--ink-2);font-size:.9rem;margin:0 0 26px}
.gate form{display:grid;gap:14px;text-align:left;background:var(--panel);
  border:1px solid var(--line);border-radius:16px;padding:24px;
  box-shadow:0 16px 36px -30px var(--shadow)}
.gate label{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-2);font-weight:700;display:block;margin-bottom:7px}
.gate select,.gate input{width:100%;background:var(--ground);border:1px solid var(--line-2);
  border-radius:12px;padding:13px 15px;color:inherit;font:inherit}
.gate select:focus,.gate input:focus{outline:none;border-color:var(--gold-2);
  box-shadow:0 0 0 3px var(--wash-gold)}
.gate button{background:var(--accent);border:1px solid var(--accent);color:var(--on-accent);
  padding:13px;border-radius:12px;font:inherit;font-weight:600;cursor:pointer}
.gate button:disabled{opacity:.6;cursor:default}
.gate .err{color:var(--accent);font-size:.85rem;min-height:1.2em;text-align:center;margin:0}
.gate .foot{color:var(--ink-2);font-size:.78rem;margin:18px 0 0}

/* ---------- the book, as rows ---------- */
.pickdates{display:flex;gap:10px;align-items:end;flex-wrap:wrap;padding:10px 0 2px}
.pickdates[hidden]{display:none}
.pickdates label{display:grid;gap:5px;font-size:.68rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-2);font-weight:700}
.pickdates input{padding:8px 11px;border:1px solid var(--line-2);border-radius:10px;
  background:var(--panel);color:inherit;font:inherit;font-size:.88rem;min-width:9.5rem}
.pickdates input:focus{outline:none;border-color:var(--gold-2);box-shadow:0 0 0 3px var(--wash-gold)}
.sum{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:14px 0 2px;
  color:var(--ink-2);font-size:.86rem}
.sum b{color:var(--ink);font-size:1.05rem;font-family:Marcellus,Georgia,serif;font-weight:400}
.sum .dot{width:3px;height:3px;border-radius:50%;background:var(--line-2);display:inline-block}

.head{display:none}
@media (min-width:760px){
  .head{display:grid;gap:14px;padding:10px 16px 8px;
    grid-template-columns:14px 8.6rem minmax(0,1fr) 6.2rem 5.6rem 4.8rem 6.4rem 16px;
    font-size:.7rem;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-2);
    font-weight:600;border-bottom:1px solid var(--line)}
  .head .r{text-align:right}
}

.list{display:grid;gap:8px;padding:8px 0 60px}
.order{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 1px 2px var(--shadow);overflow:hidden;transition:border-color .15s}
.order:hover{border-color:var(--line-2)}
.order.open{border-color:var(--gold-2);box-shadow:0 4px 16px -8px var(--shadow)}
/* Confirmed means we have promised it and it is not out of the door yet, so
   those are the ones to keep an eye on. A gold edge and a wash, so they can be
   picked out of a long list without reading a word of it. */
.order.st-confirmed{background:var(--wash-gold);border-color:var(--gold-2);
  box-shadow:inset 3px 0 0 var(--confirmed),0 1px 2px var(--shadow)}
.order.st-confirmed:hover{border-color:var(--confirmed)}
.order.st-confirmed.open{box-shadow:inset 3px 0 0 var(--confirmed),0 4px 16px -8px var(--shadow)}
.order.st-confirmed .ref{font-weight:600}
.order.st-confirmed .stword{font-weight:700}

.row{display:grid;gap:6px 12px;align-items:center;padding:12px 14px;cursor:pointer;
  width:100%;border:0;background:none;color:inherit;font:inherit;text-align:left;
  grid-template-columns:12px 1fr auto auto;
  grid-template-areas:"s ref pay money" "s who who meta"}
.row:focus-visible{outline:2px solid var(--gold-2);outline-offset:-2px}
.row .dotst{grid-area:s;width:9px;height:9px;border-radius:50%;background:currentColor}
.row .ref{grid-area:ref;font-family:Marcellus,Georgia,serif;font-size:1rem;letter-spacing:.03em}
.row .who{grid-area:who;color:var(--ink-2);font-size:.84rem;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.row .money{grid-area:money;text-align:right;font-weight:700;white-space:nowrap}
.row .meta{grid-area:meta;text-align:right;color:var(--ink-2);font-size:.76rem;white-space:nowrap}
.row .chev{display:none}
.row .stword{display:none}
/* How they are paying, sitting just before the money it refers to. Paid
   online is the one worth spotting from across the room, so it is the only
   one that carries any colour. */
.row .pay{grid-area:pay;justify-self:end;font-size:.66rem;letter-spacing:.09em;
  text-transform:uppercase;font-weight:600;white-space:nowrap;
  border:1px solid var(--line-2);border-radius:999px;padding:2px 8px;color:var(--ink-2)}
.row .pay.paid{border-color:var(--sent);color:var(--sent);background:color-mix(in srgb,var(--sent) 12%,transparent)}
.row .pay.cod{border-color:var(--confirmed);color:var(--confirmed)}
.row .pay.none{border-style:dashed;opacity:.7}
@media (min-width:760px){ .row .pay{justify-self:start} }

@media (min-width:760px){
  .row{grid-template-columns:14px 8.6rem minmax(0,1fr) 6.2rem 5.6rem 4.8rem 6.4rem 16px;
    grid-template-areas:"s ref who meta word pay money chev";padding:13px 16px}
  .row .who{font-size:.9rem;color:var(--ink)}
  .row .meta{text-align:left;font-size:.8rem}
  .row .money{font-size:.95rem}
  .row .chev{grid-area:chev;display:block;color:var(--ink-2);transition:transform .18s;
    text-align:center}
  .order.open .row .chev{transform:rotate(90deg)}
  .row .stword{grid-area:word;display:block;font-size:.68rem;letter-spacing:.09em;
    text-transform:uppercase;font-weight:600;overflow:hidden;text-overflow:ellipsis}
}
.st.new{color:var(--new)} .st.confirmed{color:var(--confirmed)}
.st.sent{color:var(--sent)} .st.done{color:var(--done)} .st.cancelled{color:var(--cancelled)}
.st.deleted{color:var(--deleted)}
.order.binned{opacity:.72}
.act.bin{margin-left:auto;border-color:var(--line-2);color:var(--ink-2)}
.act.bin:hover{border-color:var(--cancelled);color:var(--cancelled)}
.act.gone{border-color:var(--accent);color:var(--accent)}
.act.gone.armed{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.binnote{padding:0 16px 12px;color:var(--ink-2);font-size:.84rem}

.more{border-top:1px solid var(--line);background:var(--ground)}
.more[hidden]{display:none}

.obody{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;padding:12px 16px 14px}
@media (max-width:640px){ .obody{grid-template-columns:1fr} }
.obody h3{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);
  font-weight:600;margin:10px 0 4px}
.who-lines{white-space:pre-wrap;word-break:break-word}
.who-lines a{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--gold-2)}
.poth{display:inline-block;border:1px solid var(--gold-2);color:var(--gold);
  border-radius:8px;padding:2px 10px;font-size:.85rem;font-weight:600}
.items{margin:0;padding:0;list-style:none}
.items li{display:flex;align-items:center;gap:11px;padding:7px 0;border-bottom:1px dotted var(--line)}
.items li:last-child{border-bottom:0}
.items .code{color:var(--ink-2);font-size:.78rem;display:block}
.items .len{color:var(--gold);font-weight:600;font-size:.85rem}
.items .what{flex:1 1 auto;min-width:0}
.items .what a{color:inherit;text-decoration:none;border-bottom:1px solid transparent;
  overflow-wrap:anywhere}
.items .what a:hover{border-bottom-color:var(--gold-2);color:var(--accent)}
.items .rup{flex:0 0 auto;white-space:nowrap}
.thumbwrap{flex:0 0 auto;display:block;line-height:0}
.thumb{flex:0 0 auto;display:block;width:48px;height:60px;border-radius:8px;overflow:hidden;
  background:var(--panel-2);border:1px solid var(--line);position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.none::after{content:"॥";position:absolute;inset:0;display:grid;place-items:center;
  color:var(--gold-2);font-size:1rem}
.money{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.money.tot{border-top:1px solid var(--line);margin-top:5px;padding-top:6px;font-weight:700}
.unset{font-style:normal;font-weight:400;color:var(--accent);font-size:.88rem}

/* the two things only the shop can supply */
.fillin{margin-top:12px;padding-top:11px;border-top:1px dotted var(--line);display:grid;gap:9px}
.fi-row{display:flex;gap:8px;align-items:end;flex-wrap:wrap}
.fi-price{display:grid;gap:5px;flex:0 1 9rem}
.fi-price span{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-2);font-weight:700}
.fi-price input{width:100%;padding:8px 11px;border:1px solid var(--line-2);border-radius:10px;
  background:var(--panel);color:inherit;font:inherit;font-size:.9rem}
.fi-price input:focus{outline:none;border-color:var(--gold-2);box-shadow:0 0 0 3px var(--wash-gold)}
.fillin .btn{padding:8px 13px;font-size:.8rem}
.fi-say{color:var(--ink-2);font-size:.8rem;align-self:center}

.payset{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.payset select{padding:7px 10px;border:1px solid var(--line-2);border-radius:10px;
  background:var(--panel);color:inherit;font:inherit;font-size:.88rem;max-width:100%}
.payset select:focus{outline:none;border-color:var(--gold-2);box-shadow:0 0 0 3px var(--wash-gold)}
.payset select:disabled{opacity:.6}
.p-say{color:var(--ink-2);font-size:.78rem}
.p-say.ok{color:var(--sent)}
.p-say.er{color:var(--accent)}
.paywhy{margin-top:5px;font-size:.75rem;color:var(--ink-2)}
b.paid{color:var(--sent);font-weight:600}

.acts{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 14px;border-top:1px solid var(--line);padding-top:12px}
.act{border:1px solid var(--line);background:transparent;color:var(--ink-2);
  padding:6px 12px;border-radius:999px;font:inherit;font-size:.8rem;cursor:pointer}
.act:hover{border-color:var(--gold);color:var(--ink)}
.act[aria-pressed="true"]{background:var(--panel-2);border-color:var(--line-2);color:var(--ink);font-weight:600}
.act.wa{margin-left:auto;border-color:var(--gold-2);color:var(--gold)}

.empty{text-align:center;padding:70px 20px;color:var(--ink-2)}
.empty .mark{font-size:2rem;color:var(--gold-2)}
.spin{text-align:center;padding:60px;color:var(--ink-2)}

#snack{position:fixed;left:50%;bottom:22px;transform:translate(-50%,120%);
  background:var(--ink);color:var(--ground);padding:11px 18px;border-radius:999px;
  font-size:.87rem;box-shadow:0 6px 22px var(--shadow);transition:transform .25s;z-index:60;
  max-width:92vw;text-align:center}
#snack.up{transform:translate(-50%,0)}
#snack:empty{display:none}
</style>
</head>
<body>

<header id="head" hidden>
  <div class="wrap">
    <div class="bar">
      <h1>Order book</h1>
      <div class="crossnav">
        <span aria-current="page">Orders</span>
        <a href="/office/new/">New order</a>
        <a href="/studio/">Studio</a>
      </div>
      <span class="who" id="who"></span>
      <button class="out" id="out">Sign out</button>
    </div>
    <div class="tabs" id="tabs"></div>
  </div>
</header>

<div class="wrap">
  <div class="tools" hidden>
    <input type="search" id="q" placeholder="Search a name, number or order code" autocomplete="off">
    <a class="btn go" href="/office/new/">+ New order</a>
    <button class="btn" id="refresh">Refresh</button>
    <a class="btn" id="csv" href="#">Download CSV</a>
  </div>
  <div class="tabs" id="dates" hidden></div>
  <div class="pickdates" id="pick" hidden>
    <label>From <input type="date" id="d-from"></label>
    <label>To <input type="date" id="d-to"></label>
    <button class="btn" id="d-clear" type="button">Clear</button>
  </div>
  <div class="sum" id="sum" hidden></div>
  <div id="msg"></div>
  <div class="head" id="head2" hidden>
    <span></span><span>Order</span><span>Customer</span><span>Placed</span>
    <span>Status</span><span>Paying</span><span class="r">Total</span><span></span>
  </div>
  <div class="list" id="list"><div class="spin">Opening the book…</div></div>
</div>

<div id="snack"></div>

<script>
const STATUSES = [
  {id:"all",       t:"Everything"},
  {id:"new",       t:"New"},
  {id:"confirmed", t:"Confirmed"},
  {id:"sent",      t:"Sent"},
  {id:"done",      t:"Done"},
  {id:"cancelled", t:"Cancelled"},
  /* A bin, not a state an order passes through — so it sits apart, at the end,
     and Everything never shows what is in it. */
  {id:"deleted",   t:"Deleted"}
];
/* The five a real order moves between. "deleted" is not one of them — it has
   its own button, and its own way back. */
const NEXT  = ["new","confirmed","sent","done","cancelled"];
const RANGES = [
  {id:"today",  t:"Today"},
  {id:"7d",     t:"7 days"},
  {id:"30d",    t:"30 days"},
  {id:"all",    t:"Everything"},
  {id:"picked", t:"Pick dates"}
];
const STAFF = ["9011240352","7558209163","9579628754"];

let VIEW = "all", RANGE = "30d", FROM = "", TO = "", ORDERS = [], COUNTS = {}, TIMER = null;
let OPEN = new Set();          // which orders are expanded

/* Remember how you last left it, so the book opens the way you use it. */
try {
  const kept = JSON.parse(localStorage.getItem("qala.book") || "{}");
  if (RANGES.some(r => r.id === kept.range)) RANGE = kept.range;
  if (STATUSES.some(s => s.id === kept.view)) VIEW = kept.view;
  FROM = kept.from || ""; TO = kept.to || "";
} catch (e) {}
const remember = () => {
  try { localStorage.setItem("qala.book",
    JSON.stringify({range: RANGE, view: VIEW, from: FROM, to: TO})); } catch (e) {}
};

const $  = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rupees = n => "₹" + Number(n || 0).toLocaleString("en-IN");
const pretty = p => p.slice(0,5) + " " + p.slice(5);

function snack(text){
  const el = $("#snack");
  el.textContent = text; el.classList.add("up");
  clearTimeout(TIMER);
  TIMER = setTimeout(() => el.classList.remove("up"), 3200);
}

/* Just how long ago, for the narrow column. */
function ago(iso){
  const d = new Date(iso);
  if (isNaN(d)) return "";
  const mins = (Date.now() - d.getTime()) / 60000;
  return mins < 2 ? "just now"
       : mins < 60 ? Math.floor(mins) + " min ago"
       : mins < 1440 ? Math.floor(mins / 60) + " h ago"
       : mins < 1440 * 7 ? Math.floor(mins / 1440) + " d ago"
       : new Intl.DateTimeFormat("en-IN", {timeZone:"Asia/Kolkata",
           day:"numeric", month:"short"}).format(d);
}
/* The whole thing, for the tooltip and the opened view. */
function fullWhen(iso){
  const d = new Date(iso);
  if (isNaN(d)) return "";
  return new Intl.DateTimeFormat("en-IN", {timeZone:"Asia/Kolkata", day:"numeric",
    month:"long", year:"numeric", hour:"numeric", minute:"2-digit", hour12:true}).format(d);
}

/* Indian time, so the dates read the way they do in the shop. */
function when(iso){
  const d = new Date(iso);
  if (isNaN(d)) return "";
  const day = new Intl.DateTimeFormat("en-IN", {timeZone:"Asia/Kolkata",
    day:"numeric", month:"short", hour:"numeric", minute:"2-digit", hour12:true}).format(d);
  const mins = (Date.now() - d.getTime()) / 60000;
  const ago = mins < 2 ? "just now"
            : mins < 60 ? Math.floor(mins) + " min ago"
            : mins < 1440 ? Math.floor(mins / 60) + " h ago"
            : Math.floor(mins / 1440) + " d ago";
  return day + " · " + ago;
}

const PAYNAME = {online:"Paying online", shop:"Cash at the shop", cod:"Cash on delivery"};

/* The short word for the list. Once the money is actually in, that is the
   thing to say — how she meant to pay stops mattering. */
const PAYSHORT = {online:"Online", shop:"Shop", cod:"COD"};
function payTag(o){
  if (o.pay_state === "paid")
    return {t:"Paid", cls:"paid", why:"Paid online" + (o.pay_id ? " \u00b7 " + o.pay_id : "")};
  if (!o.pay) return {t:"\u2014", cls:"none", why:"Not settled yet"};
  return {t: PAYSHORT[o.pay] || o.pay, cls: o.pay, why: PAYNAME[o.pay] || o.pay};
}
/* "site" is the website itself and is not worth saying twice. */
const SRCNAME = {whatsapp:"WhatsApp", instagram:"Instagram",
                 phone:"Phone call", shop:"At the shop"};
const cameFrom = o => (o.source && o.source !== "site") ? (SRCNAME[o.source] || o.source) : "";

/* The pieces, as the shop publishes them. Read once, so an order can show
   the photograph and link back to the piece. It is the same public file the
   shop itself uses, so there is nothing extra to keep in step. */
let PIECES = {};
async function loadPieces(){
  try {
    const r = await fetch("/photos/catalogue.json", {cache: "no-store"});
    if (!r.ok) return;
    const cat = await r.json();
    const out = {};
    (cat.categories || []).forEach(c =>
      (c.products || []).forEach(p => { out[p.code] = p; }));
    PIECES = out;
  } catch (e) { /* the order still reads fine without the picture */ }
}

/* photos/hand-made-rajwadi/1000 (2)/1.jpg — spaces and brackets and all */
const fileUrl = p => "/" + String(p).split("/").map(encodeURIComponent).join("/");
const pieceUrl = code => "/#/piece/" + encodeURIComponent(code);

const api = (path, opts) =>
  fetch(path, Object.assign({credentials:"same-origin", cache:"no-store"}, opts));

/* ---------- the way in ---------- */

function gate(why){
  $("#head").hidden = true;
  $(".tools").hidden = true;
  $("#dates").hidden = true;
  $("#pick").hidden = true;
  $("#sum").hidden = true;
  $("#head2").hidden = true;
  $("#msg").innerHTML = "";
  $("#list").innerHTML = `
    <div class="gate">
      <span class="mr">कला</span>
      <h1>The Qala</h1>
      <p class="sub">The order book is for the shop only.</p>
      <form id="gateForm" autocomplete="on">
        <div>
          <label for="g-phone">Your number</label>
          <select id="g-phone" name="phone">
            ${STAFF.map(p => `<option value="${p}">${pretty(p)}</option>`).join("")}
          </select>
        </div>
        <div>
          <label for="g-pass">Password</label>
          <input id="g-pass" name="password" type="password" autocomplete="current-password"
                 placeholder="••••••••" autocapitalize="off" spellcheck="false">
        </div>
        <p class="err" id="g-err">${why && !/^Sign in/.test(why) ? esc(why) : ""}</p>
        <button type="submit" id="g-go">Sign in</button>
      </form>
      <p class="foot">Signed in for 30 days on this device.</p>
    </div>`;

  const form = $("#gateForm"), err = $("#g-err"), go = $("#g-go");
  const last = (() => { try { return localStorage.getItem("qala.staff"); } catch { return null; } })();
  if (last && STAFF.includes(last)) form.phone.value = last;
  setTimeout(() => $("#g-pass").focus(), 60);

  form.onsubmit = async e => {
    e.preventDefault();
    const password = form.password.value;
    if (!password) { err.textContent = "Enter the password."; return; }
    go.disabled = true; go.textContent = "Checking…"; err.textContent = "";
    try {
      const r = await api("/office/login", {
        method: "POST", headers: {"content-type":"application/json"},
        body: JSON.stringify({phone: form.phone.value, password})
      });
      const d = await r.json();
      if (!r.ok || !d.ok) throw new Error(d.why || "That did not work.");
      try { localStorage.setItem("qala.staff", form.phone.value); } catch {}
      const next = new URLSearchParams(location.search).get("next");
      if (next && next.startsWith("/") && !next.startsWith("//")) { location.href = next; return; }
      $("#list").innerHTML = `<div class="spin">Opening the book…</div>`;
      load();
    } catch (e2) {
      err.textContent = e2.message;
      go.disabled = false; go.textContent = "Sign in";
      form.password.value = ""; form.password.focus();
    }
  };
}

async function signOut(){
  try { await api("/office/logout", {method:"POST"}); } catch {}
  ORDERS = []; COUNTS = {};
  gate("");
}

/* ---------- the book ---------- */

async function load(){
  const q = $("#q") ? $("#q").value.trim() : "";
  const picked = RANGE === "picked" && (FROM || TO);
  const url = "/office/api?status=" + encodeURIComponent(VIEW)
            + "&range=" + encodeURIComponent(picked ? "all" : RANGE)
            + (picked && FROM ? "&from=" + encodeURIComponent(FROM) : "")
            + (picked && TO   ? "&to="   + encodeURIComponent(TO)   : "")
            + (q ? "&q=" + encodeURIComponent(q) : "");

  let r, data;
  try {
    const both = Promise.all([api(url), Object.keys(PIECES).length ? null : loadPieces()]);
    r = (await both)[0];
    data = await r.json();
  }
  catch { shut("Could not reach the order book. Check you are online, then refresh."); return; }

  if (r.status === 401 || (data && data.login)) { gate(data && data.why); return; }
  if (!r.ok || !data.ok) { shut(data && data.why ? data.why : "The order book refused that request."); return; }

  $("#head").hidden = false;
  $(".tools").hidden = false;
  $("#dates").hidden = false;
  $("#sum").hidden = false;
  $("#pick").hidden = RANGE !== "picked";
  $("#csv").href = url + "&format=csv";
  $("#msg").innerHTML = "";
  $("#who").textContent = data.you ? "signed in as " + data.you : "";
  COUNTS = {};
  (data.counts || []).forEach(c => { COUNTS[c.status] = c.n; });
  /* Everything counts what Everything shows, so the bin is left out of it. */
  COUNTS.all = Object.keys(COUNTS)
    .filter(k => k !== "deleted")
    .reduce((a, k) => a + COUNTS[k], 0);
  ORDERS = data.orders || [];
  /* Only keep open the ones still on screen. */
  OPEN = new Set([...OPEN].filter(ref => ORDERS.some(o => o.ref === ref)));
  paintTabs();
  paintDates();
  wirePicker();
  paintSum();
  paintList();
}

/* Signed in, but something on Cloudflare's side is not finished yet. */
function shut(why){
  $("#list").innerHTML = "";
  $(".tools").hidden = true;
  $("#dates").hidden = true;
  $("#pick").hidden = true;
  $("#sum").hidden = true;
  $("#head2").hidden = true;
  $("#tabs").innerHTML = "";
  $("#msg").innerHTML = `<div class="note bad">
    <h2>The order book cannot open</h2>
    <p style="margin-bottom:0">${esc(why)}</p></div>`;
}

function paintTabs(){
  $("#tabs").innerHTML = STATUSES.map(s => {
    const n = COUNTS[s.id] || 0;
    return `<button class="tab" data-view="${s.id}" aria-pressed="${VIEW === s.id}">
      ${s.t}${n ? ` <b>${n}</b>` : ""}</button>`;
  }).join("");
  document.querySelectorAll("[data-view]").forEach(b => {
    b.onclick = () => { VIEW = b.dataset.view; remember(); load(); };
  });
}

function paintDates(){
  $("#dates").innerHTML = RANGES.map(r => {
    const label = r.id === "picked" && (FROM || TO) ? pickedLabel() : r.t;
    return `<button class="tab" data-range="${r.id}" aria-pressed="${RANGE === r.id}">${esc(label)}</button>`;
  }).join("");
  document.querySelectorAll("[data-range]").forEach(b => {
    b.onclick = () => {
      RANGE = b.dataset.range;
      $("#pick").hidden = RANGE !== "picked";
      remember();
      /* Picking dates shows the two boxes; nothing loads until a day is chosen. */
      if (RANGE === "picked" && !FROM && !TO) { paintDates(); $("#d-from").focus(); return; }
      load();
    };
  });
}

/* "12 – 18 Sep", or one end of it. */
function pickedLabel(){
  const nice = t => {
    const d = new Date(t + "T00:00:00");
    return isNaN(d) ? t : new Intl.DateTimeFormat("en-IN",
      {day:"numeric", month:"short"}).format(d);
  };
  if (FROM && TO) return FROM === TO ? nice(FROM) : nice(FROM) + " – " + nice(TO);
  if (FROM) return "From " + nice(FROM);
  return "Up to " + nice(TO);
}

function wirePicker(){
  const f = $("#d-from"), t = $("#d-to"), clear = $("#d-clear");
  if (!f) return;
  f.value = FROM; t.value = TO;
  /* Nobody placed an order tomorrow. */
  const today = new Intl.DateTimeFormat("en-CA", {timeZone:"Asia/Kolkata"}).format(new Date());
  f.max = today; t.max = today;

  const changed = () => {
    FROM = f.value; TO = t.value;
    /* Picked back to front? Turn it round rather than showing nothing. */
    if (FROM && TO && FROM > TO) { [FROM, TO] = [TO, FROM]; f.value = FROM; t.value = TO; }
    RANGE = "picked";
    remember();
    load();
  };
  f.onchange = changed;
  t.onchange = changed;
  clear.onclick = () => {
    FROM = ""; TO = ""; f.value = ""; t.value = "";
    RANGE = "30d"; $("#pick").hidden = true;
    remember(); load();
  };
}

/* What is on screen, and what it comes to. Cancelled orders are left out of
   the money — they are not going to be paid. */
function paintSum(){
  const live = ORDERS.filter(o => o.status !== "cancelled" && o.status !== "deleted");
  const money = live.reduce((a, o) => a + (Number(o.total) || 0), 0);
  const pieces = live.reduce((a, o) =>
    a + (o.items || []).reduce((b, l) => b + (Number(l.qty) || 1), 0), 0);
  /* Dates keep their capitals — "3 Sept" reads wrong as "3 sept". */
  const label = RANGE === "picked" && (FROM || TO)
    ? pickedLabel()
    : (RANGES.find(r => r.id === RANGE) || {}).t.toLowerCase();
  $("#sum").innerHTML = ORDERS.length
    ? `<b>${ORDERS.length}</b> order${ORDERS.length === 1 ? "" : "s"}
       <span class="dot"></span> ${pieces} piece${pieces === 1 ? "" : "s"}
       <span class="dot"></span> <b>${rupees(money)}</b>
       <span class="dot"></span> ${esc(label)}${(() => {
         /* Cancelled and binned orders are shown but not added up, and the
            line should name whichever of the two is actually sitting there. */
         const off = ORDERS.length - live.length;
         if (!off) return "";
         const kinds = [];
         if (ORDERS.some(o => o.status === "cancelled")) kinds.push("cancelled");
         if (ORDERS.some(o => o.status === "deleted"))   kinds.push("deleted");
         return ` <span class="dot"></span> ${off} ${kinds.join(" or ")}, not counted`;
       })()}`
    : "";
}

function paintList(){
  $("#head2").hidden = !ORDERS.length;
  if (!ORDERS.length){
    $("#list").innerHTML = `<div class="empty"><div class="mark">॥</div>
      <p>Nothing here${RANGE === "all" ? "" : " in this stretch of time"}.${
        VIEW === "all" && RANGE === "all" ? " Orders appear the moment someone places one." : ""}</p></div>`;
    return;
  }
  $("#list").innerHTML = ORDERS.map(row).join("");
  wire();
}

/* One line each, until you open one. */

  const open = OPEN.has(o.ref);
  return `<article class="order st-${esc(o.status)} ${open ? "open" : ""}${
    o.status === "deleted" ? " binned" : ""}" data-ref="${esc(o.ref)}">
    <button class="row" type="button" aria-expanded="${open}">
      <span class="dotst st ${esc(o.status)}" title="${esc(o.status)}"></span>
      <span class="ref">${esc(o.ref)}</span>
      <span class="who">${cameFrom(o) ? `<b class="tag ${esc(o.source)}">${esc(cameFrom(o))}</b> ` : ""
        }${esc(o.name)} <span style="opacity:.6">· ${esc(o.phone)}</span></span>
      <span class="meta" title="${esc(fullWhen(o.placed_at))}">${esc(ago(o.placed_at))}</span>
      <span class="stword st ${esc(o.status)}" style="background:none">${esc(o.status)}</span>
      <span class="pay ${payTag(o).cls}" title="${esc(payTag(o).why)}">${esc(payTag(o).t)}</span>
      <span class="money">${cameFrom(o) && !o.total

    <div class="more" ${open ? "" : "hidden"}>${open ? detail(o) : ""}</div>

}

/* Everything about one order — built only when it is opened. */
function detail(o){
  /* An order taken on WhatsApp has a photograph of its own instead of a piece
     from the website. It is behind the same sign-in as this page. */
  /* The moment it last changed rides along, so replacing a picture is seen
     straight away rather than the browser showing yesterday's from its cache. */
  const chat = o.photo
    ? "/office/img/" + encodeURIComponent(o.ref) + "?v=" + encodeURIComponent(o.updated_at || "")
    : "";

  const items = (o.items || []).map((l, i) => {
    const piece = PIECES[l.code];
    const shot  = piece && (piece.images || [])[0];
    /* The website's photograph if we know the piece, otherwise the one they
       sent in — which belongs to the first line, the only one an office
       order ever has. */
    const src  = shot ? fileUrl(shot) : (i === 0 ? chat : "");
    const href = piece ? pieceUrl(l.code) : (i === 0 && chat ? chat : "");
    const title = href
      ? `<a href="${href}" target="_blank" rel="noopener">${esc(l.title || l.code)}</a>`
      : esc(l.title || l.code);
    const box = `<span class="thumb ${src ? "" : "none"}">${src
      ? `<img src="${src}" alt="" loading="lazy"
              onerror="const b=this.parentNode;this.remove();b&&b.classList.add('none')">` : ""}</span>`;
    return `<li>
      ${href ? `<a class="thumbwrap" href="${href}" target="_blank" rel="noopener"
                   title="${piece ? "Open this piece on the shop" : "See the whole picture"}"
                >${box}</a>` : box}
      <span class="what">
        ${title}${l.size ? ` <b class="len">${esc(l.size)}&Prime;</b>` : ""}
        <span class="code">${l.code === "OFFLINE" ? "" : esc(l.code) + " "}× ${l.qty}${
          piece && piece.price !== l.price ? ` · now ${rupees(piece.price)}` : ""}</span>
      </span>
      <span class="rup">${rupees(l.price * l.qty)}</span></li>`;
  }).join("");

  const pickup = o.pay === "shop";
  const perItem = (o.items || []).some(l => l.size);
  const where = pickup
    ? `${esc(o.name)}\n<a href="tel:+91${esc(o.phone)}">${esc(o.phone)}</a>\nCollecting at the shop`
    : `${esc(o.name)}\n<a href="tel:+91${esc(o.phone)}">${esc(o.phone)}</a>\n${esc(o.address)}\n${esc(o.pincode)}`;

  return `<div class="obody">
      <div>
        <h3>Placed</h3>
        <div>${esc(fullWhen(o.placed_at))}</div>
        ${cameFrom(o) ? `<h3>Came from</h3>
        <div><b class="tag ${esc(o.source)}">${esc(cameFrom(o))}</b>
          <span style="color:var(--ink-2);font-size:.85rem"> — not a website order, so it
          does not change how many are left on the website</span></div>` : ""}
        <h3>Who</h3>
        <div class="who-lines">${where}</div>
        <h3>How they are paying</h3>
        ${o.pay_state === "paid"
          ? `<div>${esc(PAYNAME.online)} <b class="paid">already paid</b></div>`
          : `<div class="payset">
          <select class="p-pay" aria-label="How they are paying">
            ${["online", "shop", "cod"].map(id => `<option value="${id}"${
              (o.pay || "online") === id ? " selected" : ""}>${esc(PAYNAME[id])}</option>`).join("")}
          </select>
          <span class="p-say"></span>
        </div>
        ${cameFrom(o) ? "" : `<div class="paywhy">Changing this works the shipping
          and any cash-on-delivery charge out again.</div>`}`}
        ${o.note ? `<h3>To remember</h3>
        <div class="who-lines">${esc(o.note)}</div>` : ""}
        ${perItem ? "" : `<h3>Poth length</h3>
        <div>${o.poth ? `<span class="poth">${esc(o.poth)} inches</span>`
                      : `<span style="color:var(--ink-2)">to be settled on WhatsApp</span>`}</div>`}
      </div>
      <div>
        <h3>${(o.items || []).length} piece${(o.items || []).length === 1 ? "" : "s"}</h3>
        <ul class="items">${items}</ul>
        ${cameFrom(o) ? "" : `
        <div class="money"><span>Pieces</span><span>${rupees(o.goods)}</span></div>
        ${pickup ? "" : `<div class="money"><span>Shipping</span><span>${o.shipping ? rupees(o.shipping) : "Free"}</span></div>`}
        ${o.cod_fee ? `<div class="money"><span>Cash on delivery</span><span>${rupees(o.cod_fee)}</span></div>` : ""}`}
        <div class="money tot"><span>${cameFrom(o) ? "Agreed price" : "Total"}</span><span>${
          cameFrom(o) && !o.total ? `<i class="unset">not set yet</i>` : rupees(o.total)}</span></div>
        ${cameFrom(o) ? fillIn(o, chat) : ""}
      </div>
    </div>
    <div class="acts">
      ${o.status === "deleted"
        ? `<button class="act" data-set="new">Put it back</button>
           <button class="act gone" data-purge>Remove for good</button>`
        : `${NEXT.map(st => `<button class="act" data-set="${st}" aria-pressed="${o.status === st}">${st}</button>`).join("")}
           <button class="act bin" data-set="deleted" title="Out of the book, but not gone">Delete</button>`}
      <a class="act wa" href="https://wa.me/91${esc(o.phone)}" target="_blank" rel="noopener">WhatsApp</a>
    </div>
    ${o.status === "deleted" ? `<div class="binnote">Out of Everything, and not holding any piece.
      It stays here until you remove it for good, which cannot be undone.</div>` : ""}`;
}

/* The two things only the shop can supply: what it costs, and the picture.
   Shown on every order that did not come through the website — whether we
   typed it in or she filled the link in herself. */
function fillIn(o, chat){
  return `<div class="fillin">
    <div class="fi-row">
      <label class="fi-price">
        <span>Price</span>
        <input type="number" class="f-price" min="0" max="5000000" step="1"
               inputmode="numeric" value="${o.total || ""}" placeholder="0">
      </label>
      <button class="btn f-save" type="button">Save the price</button>
    </div>
    <div class="fi-row">
      <button class="btn f-add" type="button">${chat ? "Replace the picture" : "Add the picture"}</button>
      ${chat ? `<button class="btn f-drop" type="button">Remove it</button>` : ""}
      <input type="file" class="f-file" accept="image/*" hidden>

/* A chat photograph is often four thousand pixels wide and several megabytes.
   Nothing here is bigger than a thumbnail, so it is brought down on this phone
   before it travels. Same as the new-order form. */
function shrink(file, longest = 1400){
  return new Promise((resolve, reject) => {
    if (!/^image\//.test(file.type)) return reject(new Error("That is not a picture."));
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const scale = Math.min(1, longest / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width  = Math.max(1, Math.round(img.width  * scale));
      c.height = Math.max(1, Math.round(img.height * scale));
      const g = c.getContext("2d");
      g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
      g.drawImage(img, 0, 0, c.width, c.height);
      let out = "";
      for (const q of [0.72, 0.6, 0.48, 0.36]){
        out = c.toDataURL("image/jpeg", q);
        if (out.length < 900000) break;
      }
      if (out.length > 1400000) return reject(new Error("That picture is too big, even shrunk."));
      resolve(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url);
      reject(new Error("This browser cannot open that picture — save it as a JPG first.")); };
    img.src = url;
  });
}

function wire(){
  document.querySelectorAll(".order").forEach(el => {
    const ref = el.dataset.ref;
    const o = ORDERS.find(x => x.ref === ref);

    /* Opening one is instant — the detail is built the first time it is asked for. */
    el.querySelector(".row").onclick = () => {
      const now = !OPEN.has(ref);
      now ? OPEN.add(ref) : OPEN.delete(ref);
      const box = el.querySelector(".more");
      if (now && !box.innerHTML.trim()) box.innerHTML = detail(o);
      box.hidden = !now;
      el.classList.toggle("open", now);
      el.querySelector(".row").setAttribute("aria-expanded", String(now));
      if (now) { bindActs(el, ref); bindFill(el, ref); bindPurge(el, ref); bindPay(el, ref); }
    };
    if (OPEN.has(ref)) { bindActs(el, ref); bindFill(el, ref); bindPurge(el, ref); bindPay(el, ref); }
  });
}

/* Changing how an order is being paid for. The shipping and the cash-on-delivery
   charge are worked out again on the server, from the price already on the row,
   so the book is read back rather than patched from here. */
function bindPay(el, ref){
  const pick = el.querySelector(".p-pay");
  const say  = el.querySelector(".p-say");
  if (!pick || pick.dataset.wired) return;
  pick.dataset.wired = "1";

  let before = pick.value;
  pick.onchange = async () => {
    const want = pick.value;
    pick.disabled = true;
    say.textContent = "changing\u2026"; say.className = "p-say";
    try {
      const r = await api("/office/api", {
        method: "POST", headers: {"content-type": "application/json"},
        body: JSON.stringify({ref, pay: want})
      });
      const d = await r.json();
      if (r.status === 401) { gate(d.why); return; }
      if (!r.ok || !d.ok) throw new Error(d.why || "refused");
      before = want;
      snack(ref + " \u2014 " + (PAYNAME[want] || want).toLowerCase());
      /* The total may well have moved, so take the whole book afresh. */
      await load();
    } catch (err) {
      pick.value = before;                 /* leave it saying what is true */
      pick.disabled = false;
      say.textContent = err.message || "that did not work";
      say.className = "p-say er";
    }
  };
}

/* Filling in a price, or putting a picture on afterwards. */
function bindFill(el, ref){
  const say   = el.querySelector(".fi-say");
  const price = el.querySelector(".f-price");
  const save  = el.querySelector(".f-save");
  const add   = el.querySelector(".f-add");
  const drop  = el.querySelector(".f-drop");
  const file  = el.querySelector(".f-file");
  if (!save) return;

  const send = async (body, working, done) => {
    if (say) say.textContent = working;
    try {
      const r = await api("/office/api", {
        method: "POST", headers: {"content-type": "application/json"},
        body: JSON.stringify(Object.assign({ref}, body))
      });
      const d = await r.json();
      if (r.status === 401) { gate(d.why); return false; }
      if (!r.ok || !d.ok) throw new Error(d.why || "refused");
      snack(ref + " — " + done);
      /* Read it back rather than guess: the price lands on the piece too. */
      await load();
      return true;
    } catch (err) {
      if (say) say.textContent = "";
      snack("That did not save. " + (err.message || ""));
      return false;
    }
  };

  save.onclick = e => {
    e.stopPropagation();
    const n = Math.floor(Number(price.value));
    if (!Number.isFinite(n) || n < 0) { snack("That is not a price."); price.focus(); return; }
    save.disabled = true;
    send({price: n}, "", "price saved").then(() => { save.disabled = false; });
  };
  price.onclick = e => e.stopPropagation();
  price.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); save.click(); } };

  add.onclick = e => { e.stopPropagation(); file.click(); };
  file.onchange = async e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!f) return;
    if (say) say.textContent = "Shrinking…";
    let shot;
    try { shot = await shrink(f); }
    catch (err) { if (say) say.textContent = err.message; return; }
    add.disabled = true;
    await send({photo: shot}, "Saving the picture…", "picture saved");
    add.disabled = false;
  };

  if (drop) drop.onclick = e => {
    e.stopPropagation();
    drop.disabled = true;
    send({photo: ""}, "Removing…", "picture removed").then(() => { drop.disabled = false; });
  };
}

function bindActs(el, ref){
  el.querySelectorAll("[data-set]").forEach(b => {
    b.onclick = async e => {
      e.stopPropagation();
      const was = ORDERS.find(o => o.ref === ref);
      const from = was ? was.status : null;
      if (from === b.dataset.set) return;

      /* Into the bin or out of it, the order leaves the list you are looking
         at — so that one is read again rather than patched in place. */
      const moves = b.dataset.set === "deleted" || from === "deleted";

      /* Move it on screen first, put it back if the save does not land. */
      if (!moves) setStatus(ref, b.dataset.set);
      try {
        const r = await api("/office/api", {
          method: "POST",
          headers: {"content-type": "application/json"},
          body: JSON.stringify({ref, status: b.dataset.set})
        });
        const d = await r.json();
        if (r.status === 401) { gate(d.why); return; }
        if (!r.ok || !d.ok) throw new Error(d.why || "refused");
        snack(ref + (b.dataset.set === "deleted"
          ? " — moved to Deleted"
          : (from === "deleted" ? " — put back" : " — " + b.dataset.set)));
        if (moves) await load();
      } catch (err) {
        if (!moves && from) setStatus(ref, from);
        snack("That did not save. " + (err.message || ""));
      }
    };
  });
}

/* The only thing in the whole book that cannot be undone, so it asks first —
   in place, on the button itself, rather than throwing up a dialog box. */
function bindPurge(el, ref){
  const btn = el.querySelector("[data-purge]");
  if (!btn) return;
  let armed = null;
  btn.onclick = async e => {
    e.stopPropagation();
    if (!armed) {
      btn.textContent = "Sure? This cannot be undone";
      btn.classList.add("armed");
      armed = setTimeout(() => {
        armed = null; btn.textContent = "Remove for good"; btn.classList.remove("armed");
      }, 5000);
      return;
    }
    clearTimeout(armed); armed = null;
    btn.disabled = true;
    try {
      const r = await api("/office/api", {
        method: "POST",
        headers: {"content-type": "application/json"},
        body: JSON.stringify({ref, purge: true})
      });
      const d = await r.json();
      if (r.status === 401) { gate(d.why); return; }
      if (!r.ok || !d.ok) throw new Error(d.why || "refused");
      snack(ref + " — removed for good");
      await load();
    } catch (err) {
      btn.disabled = false;
      btn.textContent = "Remove for good"; btn.classList.remove("armed");
      snack("That did not work. " + (err.message || ""));
    }
  };
}

function setStatus(ref, status){
  const o = ORDERS.find(x => x.ref === ref);
  if (o) o.status = status;
  const el = document.querySelector(`.order[data-ref="${CSS.escape(ref)}"]`);
  if (!el) return;
  const dot = el.querySelector(".dotst"), word = el.querySelector(".stword");
  if (dot)  { dot.className = "dotst st " + status; dot.title = status; }
  if (word) { word.className = "stword st " + status; word.textContent = status; }
  /* The card is coloured by its status, so that has to move with it — the
     list is not painted again when you press one of these buttons. */
  [...el.classList].forEach(c => { if (c.startsWith("st-")) el.classList.remove(c); });
  el.classList.add("st-" + status);
  el.classList.toggle("binned", status === "deleted");
  el.querySelectorAll("[data-set]").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.set === status)));
}

$("#refresh").onclick = load;
$("#out").onclick = signOut;
let typing = null;
$("#q").oninput = () => { clearTimeout(typing); typing = setTimeout(load, 350); };
load();
</script>
