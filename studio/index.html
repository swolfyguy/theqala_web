<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>The Qala — studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Karla:wght@400;500;600;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --ground:#FAF3EB; --panel:#FFFBF6; --panel-2:#F1E5D6;
  --ink:#2A1A14; --ink-2:#7A6152; --line:#E7D6C2; --line-2:#CDB79B;
  --accent:#7E1226; --on-accent:#FFF6E9; --gold:#9A7325; --gold-2:#CFA84F;
  --ok:#1F7A52; --warn:#9A5B12; --bad:#9E2C3E;
  --shadow:rgba(74,42,14,.14);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#131011; --panel:#1C1719; --panel-2:#272023;
  --ink:#F3E8D8; --ink-2:#B29C8B; --line:#3A2E33; --line-2:#5A484F;
  --accent:#E0BC72; --on-accent:#1A1215; --gold:#E0BC72; --gold-2:#F0D89D;
  --ok:#5FCB9B; --warn:#E0A857; --bad:#F08098; --shadow:rgba(0,0,0,.55);
}}
body{margin:0;background:var(--ground);color:var(--ink);font-family:Karla,system-ui,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Marcellus,Georgia,serif;font-weight:400;margin:0;line-height:1.2}
a{color:var(--accent)}
img{display:block;max-width:100%}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
[hidden]{display:none !important}
.wrap{width:min(1080px,94vw);margin-inline:auto}

header{border-bottom:1px solid var(--line);background:var(--panel)}
.hrow{display:flex;align-items:center;gap:16px;padding:16px 0;flex-wrap:wrap}
.brand{font-family:Marcellus,serif;font-size:1.3rem;margin-right:auto;display:flex;align-items:baseline;gap:10px}
#nowhere{margin:18px auto}
#nowhere .box{border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:12px;background:var(--panel);padding:16px 18px}
#nowhere h2{font-size:1rem;margin:0 0 6px;font-family:inherit}
#nowhere p{margin:0 0 8px}
#nowhere p:last-child{margin-bottom:0}
#nowhere code{background:var(--panel-2);padding:1px 6px;border-radius:4px}
.crossnav{display:flex;align-items:center;gap:4px;font-size:.82rem}
.crossnav a,.crossnav span,.crossnav button{padding:5px 11px;border-radius:999px;
  text-decoration:none;color:var(--ink-2);border:1px solid transparent;
  background:none;font:inherit;font-size:.82rem;cursor:pointer}
.crossnav a:hover{border-color:var(--line-2);color:var(--ink)}
.crossnav span[aria-current]{background:var(--panel-2);color:var(--ink);font-weight:600}
.crossnav button:hover{border-color:var(--accent);color:var(--accent)}
.brand small{font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-2);font-family:Karla,sans-serif}
.repo{font-size:.8rem;color:var(--ink-2)}
.tabs{display:flex;gap:6px}
.tab{background:none;border:1px solid transparent;border-radius:999px;padding:8px 16px;cursor:pointer;font-size:.82rem;letter-spacing:.06em}
.tab:hover{background:var(--panel-2)}
.tab.on{background:var(--accent);color:var(--on-accent)}

.gitbar{border-bottom:1px solid var(--line);background:var(--panel-2)}
.gitrow{display:flex;align-items:center;gap:12px;padding:11px 0;flex-wrap:wrap}
.gitbar .dot{width:9px;height:9px;border-radius:50%;background:var(--line-2);flex:none}
.gitbar .dot.pending{background:var(--warn)}
.gitbar .dot.clean{background:var(--ok)}
.gitbar .what{font-size:.88rem;margin-right:auto}
.gitbar input{flex:1 1 230px;min-width:0;max-width:380px;background:var(--ground);border:1px solid var(--line-2);border-radius:999px;padding:9px 15px;font-size:.86rem}
.gitbar input:focus{outline:none;border-color:var(--gold-2)}
.plain{background:none;border:0;padding:0;color:var(--ink-2);font-size:.8rem;cursor:pointer;border-bottom:1px solid var(--line-2)}
.plain:hover{color:var(--accent)}
.gitdetail{padding:0 0 14px;font-size:.82rem;color:var(--ink-2);display:grid;gap:3px;max-height:220px;overflow:auto}
.gitdetail code{color:var(--ink)}
main{padding:34px 0 90px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:22px}
.card h2{font-size:1.3rem;margin-bottom:4px}
.card p.sub{color:var(--ink-2);font-size:.92rem;margin:0 0 18px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);font-weight:700}
label.f input,label.f select{background:var(--ground);border:1px solid var(--line-2);border-radius:10px;padding:11px 13px;width:100%}
label.f input:focus,label.f select:focus{outline:none;border-color:var(--gold-2)}
.hint{font-size:.82rem;color:var(--ink-2)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);padding:12px 22px;border-radius:999px;cursor:pointer;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.btn:hover{filter:brightness(1.06)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-2)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:8px 14px;font-size:.7rem}

.sizes{margin-top:16px;border:1px solid var(--line);border-radius:14px;padding:16px 18px;
  background:var(--panel-2)}
.sizes-top{display:grid;gap:4px;margin-bottom:12px}
.sizes .row{margin:0}
.sizes select{max-width:220px}
.sizes-top b{font-size:.95rem}
  border-radius:11px;padding:7px 10px;background:var(--ground)}
  font:inherit;font-size:.95rem;padding:2px 0;text-align:right}
.modepick{display:grid;gap:0;margin-top:20px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.swopt{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;cursor:pointer;
  border-bottom:1px solid var(--line);background:var(--panel);transition:background .15s}
.swopt:last-child{border-bottom:0}
.swopt:hover{background:var(--panel-2,rgba(0,0,0,.02))}
.swopt input{accent-color:var(--accent);width:17px;height:17px;margin-top:3px;flex:none}
.swopt>span{display:flex;flex-direction:column;gap:2px;min-width:0}
.swopt b{font-size:.95rem}
.swopt>span>span{font-size:.83rem;color:var(--ink-2);line-height:1.45}
.swopt:has(input:checked){background:var(--wash,rgba(140,20,40,.05))}
.swopt:has(input:checked) b{color:var(--accent)}
.drop{border:2px dashed var(--line-2);border-radius:14px;padding:38px 20px;text-align:center;cursor:pointer;transition:border-color .18s,background .18s}
.drop:hover,.drop.over{border-color:var(--gold-2);background:var(--panel-2)}
.drop b{display:block;font-size:1.02rem;margin-bottom:4px}

.queue{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:18px}
.qitem{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel-2)}
.qitem img{width:100%;aspect-ratio:4/5;object-fit:cover}
.qitem .meta{padding:8px 10px;font-size:.72rem;color:var(--ink-2)}
.qitem .meta b{display:block;color:var(--ink);font-size:.78rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qitem video{width:100%;aspect-ratio:4/5;object-fit:cover;background:#000}
.qitem .badge{position:absolute;top:8px;left:8px;background:var(--accent);color:var(--on-accent);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:999px;font-weight:700}
.qitem.isvideo .badge{background:#128C7E;color:#fff}
.qitem .nudge{position:absolute;bottom:52px;right:8px;display:flex;gap:4px}
.qitem .nudge button{width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;cursor:pointer;line-height:1;font-size:.8rem}
.piece .ttl{font-size:.9rem;margin:2px 0 1px}
.qitem .x{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;cursor:pointer;line-height:1}
.saved{color:var(--ok)}

.pieces{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:18px}

/* the shop side has filters down the left of everything it lists; so does this */
.mlayout{display:grid;grid-template-columns:200px minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:820px){ .mlayout{grid-template-columns:1fr} }
.mfilters{position:sticky;top:14px;border:1px solid var(--line);border-radius:14px;
  background:var(--panel);padding:14px 15px 16px;display:grid;gap:14px}
@media (max-width:820px){ .mfilters{position:static} }
.mfilters h4{margin:0;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-2);font-weight:700}
.mfilters label{display:flex;align-items:center;gap:9px;padding:5px 0;cursor:pointer;font-size:.9rem}
.mfilters label:hover{color:var(--accent)}
.mfilters input{accent-color:var(--accent);width:15px;height:15px;flex:none;margin:0}
.mfilters .tally{margin-left:auto;color:var(--ink-2);font-size:.78rem}
.mfilters .clear{background:none;border:0;padding:0;color:var(--accent);font:inherit;
  font-size:.8rem;cursor:pointer;text-decoration:underline;text-underline-offset:3px;
  justify-self:start}
.mfilters .clear[hidden]{display:none}
.mfilters .msearch{width:100%;border:1px solid var(--line-2);border-radius:10px;
  padding:8px 11px;background:var(--ground);color:inherit;font:inherit;font-size:.86rem}
.mfilters .msearch:focus{outline:none;border-color:var(--gold-2)}
.mcount{color:var(--ink-2);font-size:.84rem;margin:0 0 12px}
.piece{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel)}
.piece .shot{position:relative;aspect-ratio:4/5;background:var(--panel-2)}
.piece .shot img{width:100%;height:100%;object-fit:cover}
.piece .n{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.6);color:#fff;font-size:.66rem;padding:3px 8px;border-radius:999px}
.piece .body{padding:11px 12px 13px}
.piece code{font-size:.78rem;font-weight:700;display:block;margin-bottom:2px}
.piece .band{font-size:.74rem;color:var(--ink-2)}
.piece .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.groupname{display:flex;align-items:baseline;gap:12px;margin:30px 0 14px;flex-wrap:wrap}
.groupname h3{font-size:1.1rem}
.groupname span{font-size:.78rem;color:var(--ink-2)}

/* Deleting is instant and reversible, so there is no dialog to dismiss —
   just this bar, and ten seconds to change your mind. */
.snack{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:80;
  display:flex;align-items:center;gap:16px;max-width:min(560px,92vw);
  background:var(--ink);color:var(--ground);border-radius:12px;
  padding:13px 16px 13px 18px;box-shadow:0 18px 40px -18px rgba(0,0,0,.6);
  font-size:.9rem;overflow:hidden;animation:snackin .22s cubic-bezier(.2,.8,.3,1)}
.snack[hidden]{display:none}
@keyframes snackin{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
.snack .stext{flex:1;min-width:0}
.snack .sundo{flex:none;background:none;color:var(--ground);border-radius:999px;
  border:1px solid color-mix(in srgb,var(--ground) 40%,transparent);
  padding:6px 15px;cursor:pointer;
  font:inherit;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  font-size:.72rem;transition:background .15s,border-color .15s}
.snack .sundo:hover{background:color-mix(in srgb,var(--ground) 16%,transparent);
  border-color:color-mix(in srgb,var(--ground) 70%,transparent)}
.snack .sbar{position:absolute;left:0;bottom:0;height:2px;background:var(--gold-2);
  width:100%;transform-origin:left;animation:snackrun 10s linear forwards}
@keyframes snackrun{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@media (prefers-reduced-motion:reduce){.snack,.snack .sbar{animation:none}}
.piece.going{opacity:.25;transform:scale(.97);pointer-events:none;transition:opacity .2s,transform .2s}
.btn.danger.armed{background:var(--accent);color:#fff;border-color:var(--accent)}

.log{margin-top:18px;font-size:.86rem;border-left:3px solid var(--line-2);padding-left:14px;display:grid;gap:5px;max-height:230px;overflow:auto}
.log .ok{color:var(--ok)} .log .er{color:var(--bad)} .log .wa{color:var(--warn)}
.log div{line-height:1.55}
label.pick{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line-2);border-radius:12px;padding:14px 16px;cursor:pointer;background:var(--ground)}
label.pick.on{border-color:var(--gold-2);box-shadow:inset 0 0 0 1px var(--gold-2)}
label.pick input{margin-top:5px;accent-color:var(--accent)}
label.pick b{display:block;font-size:.98rem}
label.pick small{display:block;font-size:.82rem;color:var(--ink-2);margin-top:2px;word-break:break-all}
.note{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:15px 17px;font-size:.88rem;color:var(--ink-2)}
.note b{color:var(--ink)}
.empty{text-align:center;padding:60px 20px;color:var(--ink-2)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>
<body>

<header>
  <div class="wrap hrow">
    <div class="brand">The Qala <small>Studio</small></div>
    <div class="repo" id="repoLabel"></div>
    <div class="crossnav" id="crossnav" hidden>
      <a href="/office/">Orders</a>
      <a href="/office/new/">New order</a>
      <span aria-current="page">Studio</span>
      <button type="button" id="signOut">Sign out</button>
    </div>
    <nav class="tabs">
      <button class="tab on" data-tab="upload">Add a product</button>
      <button class="tab" data-tab="manage">Manage</button>
      <button class="tab" data-tab="settings">Settings</button>
    </nav>
  </div>
</header>

<div class="wrap" id="nowhere" hidden></div>

<div class="gitbar" id="gitbar" hidden>
  <div class="wrap gitrow">
    <span class="dot" id="gitDot"></span>
    <span class="what" id="gitWhat">checking…</span>
    <input id="gitMsg" placeholder="Update photographs" aria-label="Commit message">
    <button class="btn sm" id="gitPush" disabled>Commit &amp; push</button>
    <button class="plain" id="gitToggle" hidden>what changed?</button>
  </div>
  <div class="wrap gitdetail" id="gitDetail" hidden></div>
</div>

<div class="snack" id="snack" hidden>
  <span class="stext" id="snackText"></span>
  <button class="sundo" id="snackUndo" type="button">Undo</button>
  <span class="sbar" id="snackBar"></span>
</div>

<main class="wrap">
  <section id="tab-upload"></section>
  <section id="tab-manage" hidden></section>
  <section id="tab-settings" hidden></section>
</main>

<script>
/* =====================================================================
   The Qala — studio

   A private admin page. It talks to the GitHub API straight from your
   browser: photographs are shrunk here, then committed to the repository
   in one commit. The Action rebuilds the catalogue and Cloudflare
   redeploys, exactly as if you had used github.com.

   Three ways it can be running:

     local    studio.py is serving it on this computer. Files are written
              straight to the folder. No GitHub, no token.
     hosted   it is on the website at /studio/. The site's own worker holds
              the GitHub token, so this page never sees one and nothing is
              kept on the phone.
     token    the file opened on its own. Then it needs a personal token,
              kept in this browser's local storage only.
   ===================================================================== */

const SIZES = [24,26,28,30,32,34,36,38,40];   // poth lengths, in inches
const MAX_EDGE = 1400;      // longest side after shrinking
const JPEG_Q   = 0.82;
/* Where GitHub is reached. In hosted mode this becomes the site's own
   worker, which attaches the token on its side. */
let API = "https://api.github.com";
let REPO_PATH_NEEDED = true;    // false once the worker fixes the repository

const $  = s => document.querySelector(s);
const el = (t, c, h) => { const n = document.createElement(t); if (c) n.className = c; if (h != null) n.innerHTML = h; return n; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const kb = n => n >= 1e6 ? (n/1e6).toFixed(1) + " MB" : Math.round(n/1000) + " KB";

let CFG = {owner:"", repo:"", branch:"main", token:""};
try { CFG = Object.assign(CFG, JSON.parse(localStorage.getItem("qala.studio") || "{}")); } catch (e) {}
const saveCfg = () => { try { localStorage.setItem("qala.studio", JSON.stringify(CFG)); } catch (e) {} };
const ready = () => isLocal() || isHosted() || !!(CFG.owner && CFG.repo && CFG.token);

let MODE = "github";        // local | hosted | github
const LOCAL = {available:false, root:"", catalogue:null, folders:[], trash:0};

async function detectLocal(){
  try {
    const res = await fetch("/api/state", {cache:"no-store"});
    if (!res.ok) return false;
    const state = await res.json();
    if (!state || state.mode !== "local") return false;
    LOCAL.available = true; LOCAL.root = state.root || "";
    applyLocalState(state);
    return true;
  } catch (e) { return false; }
}
function applyLocalState(state){
  if (state.catalogue !== undefined) LOCAL.catalogue = state.catalogue || null;
  if (state.folders) LOCAL.folders = state.folders;
  if (state.trash !== undefined) LOCAL.trash = state.trash || 0;
  TREE = (state.photos || []).map(path => ({path, type:"blob"}));
}
const isLocal  = () => MODE === "local";
const isHosted = () => MODE === "hosted";

/* Is this page being served by the site itself, with a worker behind it that
   holds the token? Asking is the only reliable way to know. */
const HOSTED = {available:false, repo:"", branch:"main", you:"", why:""};
async function detectHosted(){
  try {
    const res = await fetch("/office/gh/config", {cache:"no-store", credentials:"same-origin"});
    if (!res.ok) return false;               // 401 means not signed in, so not hosted
    const d = await res.json();
    HOSTED.available = true;
    HOSTED.repo = d.repo || ""; HOSTED.branch = d.branch || "main";
    HOSTED.you = d.you || ""; HOSTED.why = d.why || "";
    if (d.repo) {
      const [owner, repo] = d.repo.split("/");
      CFG.owner = owner || ""; CFG.repo = repo || ""; CFG.branch = HOSTED.branch;
    }
    return !!d.ok;
  } catch (e) { return false; }
}

let TREE = [];              // every path under photos/

/* ---------- undo bar ----------
   A deleted piece is moved to the trash, not destroyed, so the studio can be
   quick about it: no dialog, just this bar and ten seconds to change your mind. */
let SNACK = null;
function snack(text, undo){
  const box = $("#snack"), bar = $("#snackBar"), btn = $("#snackUndo");
  clearTimeout(SNACK);
  $("#snackText").textContent = text;
  btn.hidden = !undo;
  box.hidden = false;
  bar.style.animation = "none"; void bar.offsetWidth; bar.style.animation = "";
  btn.onclick = async () => {
    box.hidden = true; clearTimeout(SNACK);
    try { await undo(); } catch (e) { snack(e.message); }
  };
  SNACK = setTimeout(() => { box.hidden = true; }, 10000);
}

/* ---------- log ---------- */
let logBox = null;
function say(msg, kind){
  if (!logBox) return;
  const line = el("div", kind || "", esc(msg).replace(/\n/g, "<br>"));
  logBox.appendChild(line); logBox.scrollTop = logBox.scrollHeight;
  return line;
}
</script>

<script>
/* ---------- GitHub ---------- */
async function gh(path, opts){
  /* In hosted mode the request goes to our own worker, which adds the token
     on its side. There is nothing secret in this page to send. */
  const head = Object.assign({
    "Accept": "application/vnd.github+json",
    "X-GitHub-Api-Version": "2022-11-28"
  }, (opts && opts.headers) || {});
  if (!isHosted()) head["Authorization"] = "Bearer " + CFG.token;

  const res = await fetch(API + path, Object.assign({}, opts, {
    headers: head,
    credentials: isHosted() ? "same-origin" : "omit"
  }));
  if (!res.ok){
    let detail = "";
    try { detail = (await res.json()).message || ""; } catch (e) {}
    const writing = opts && /POST|PATCH|PUT|DELETE/.test(opts.method || "");
    if (res.status === 403 || (res.status === 404 && writing)){
      throw new Error(
        "Your token is not allowed to write to this repository.\n\n" +
        "On github.com → Settings → Developer settings → Personal access tokens → " +
        "Fine-grained tokens → open your token, then:\n" +
        "1. Repository access — make sure " + CFG.repo + " is in the list.\n" +
        "2. Permissions → Repository permissions → Contents → Read and write.\n" +
        "3. Update token at the bottom.\n\n" +
        "The same token then works — no need to make a new one. " +
        "(A classic token instead needs the whole 'repo' scope.)" +
        (detail ? "\n\nGitHub said: " + detail : ""));
    }
    if (res.status === 401) throw new Error("GitHub rejected the token. It may have expired — check the expiry date, or paste a fresh one in Settings.");
    if (res.status === 409) throw new Error("Someone else pushed while this was uploading. Press the button again — nothing was lost.");
    throw new Error(`GitHub said ${res.status}${detail ? " — " + detail : ""}`);
  }
  return res.status === 204 ? null : res.json();
}
/* In hosted mode the worker already knows which repository, and refuses to
   be told otherwise — so the path it is given starts after that. */
const repoPath = () => isHosted()
  ? ""
  : `/repos/${encodeURIComponent(CFG.owner)}/${encodeURIComponent(CFG.repo)}`;

async function loadTree(){
  if (isLocal()){
    const res = await fetch("/api/state", {cache:"no-store"});
    if (!res.ok) throw new Error("the studio server stopped — restart it with `python studio.py`");
    applyLocalState(await res.json());
    return null;
  }
  const ref = await gh(`${repoPath()}/git/ref/heads/${encodeURIComponent(CFG.branch)}`);
  const commit = await gh(`${repoPath()}/git/commits/${ref.object.sha}`);
  const tree = await gh(`${repoPath()}/git/trees/${commit.tree.sha}?recursive=1`);
  TREE = (tree.tree || []).filter(n => n.type === "blob" && n.path.startsWith("photos/"));
  return {headSha: ref.object.sha, treeSha: commit.tree.sha};
}

/* one commit for a whole batch: blobs -> tree -> commit -> move the branch */
async function localPost(path, body){
  const res = await fetch(path, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)});
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok || (data && data.error)) throw new Error((data && data.error) || `the studio server said ${res.status}`);
  if (data){
    if (data.photos) applyLocalState({photos: data.photos, folders: data.folders, catalogue: data.catalogue});
    const gd = $("#gitDetail"); if (gd) delete gd.dataset.keep;
    setTimeout(refreshGit, 150);
    (data.log || []).forEach(l => say("  " + l));
    (data.warnings || []).forEach(w => say("  ! " + w, "wa"));
  }
  return data;
}

async function commitChanges(message, adds, removes){
  if (isLocal()){
    if (removes && removes.length) await localPost("/api/delete", {paths: removes});
    if (adds && adds.length){
      const files = [];
      for (const a of adds) files.push({path: a.path, b64: await toBase64(a.blob)});
      await localPost("/api/upload", {files});
    }
    return "folder";
  }
  const {headSha, treeSha} = await loadTree();
  const entries = [];

  for (const a of adds){
    say(`uploading ${a.path}…`);
    const blob = await gh(`${repoPath()}/git/blobs`, {
      method: "POST",
      body: JSON.stringify({content: await toBase64(a.blob), encoding: "base64"})
    });
    entries.push({path: a.path, mode: "100644", type: "blob", sha: blob.sha});
  }
  for (const path of removes) entries.push({path, mode: "100644", type: "blob", sha: null});

  const tree = await gh(`${repoPath()}/git/trees`, {
    method: "POST", body: JSON.stringify({base_tree: treeSha, tree: entries})
  });
  const commit = await gh(`${repoPath()}/git/commits`, {
    method: "POST", body: JSON.stringify({message, tree: tree.sha, parents: [headSha]})
  });
  await gh(`${repoPath()}/git/refs/heads/${encodeURIComponent(CFG.branch)}`, {
    method: "PATCH", body: JSON.stringify({sha: commit.sha})
  });
  return commit.sha;
}

const stockBlob = (sizes, qty) =>
  new Blob([JSON.stringify(Object.assign({qty: Number(qty) || 1}, sizes), null, 2) + "\n"],
           {type: "application/json"});

function toBase64(blob){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(",")[1]);
    r.onerror = () => reject(new Error("could not read the file"));
    r.readAsDataURL(blob);
  });
}

/* thumbnails: fetch through the API so private repositories work too */
const thumbCache = new Map();
async function thumb(path){
  if (thumbCache.has(path)) return thumbCache.get(path);
  const p = (async () => {
    if (isLocal()) return "/" + path.split("/").map(encodeURIComponent).join("/") + "?v=" + Date.now();
    const head = {"Accept": "application/vnd.github.raw"};
    if (!isHosted()) head["Authorization"] = "Bearer " + CFG.token;
    const res = await fetch(`${API}${repoPath()}/contents/${path.split("/").map(encodeURIComponent).join("/")}?ref=${encodeURIComponent(CFG.branch)}`,
      {headers: head, credentials: isHosted() ? "same-origin" : "omit"});
    if (!res.ok) throw new Error("thumbnail " + res.status);
    return URL.createObjectURL(await res.blob());
  })();
  thumbCache.set(path, p);
  return p;
}

/* ---------- shrink in the browser ---------- */
async function shrink(file){
  const out = {name: file.name, before: file.size, converted: false};
  let bitmap = null;
  try { bitmap = await createImageBitmap(file); }
  catch (e) {
    // HEIC and friends: this browser cannot decode them. Send as-is —
    // build_catalogue.py converts them on the server.
    out.blob = file; out.after = file.size; out.undecodable = true;
    out.url = ""; return out;
  }
  const scale = Math.min(1, MAX_EDGE / Math.max(bitmap.width, bitmap.height));
  const w = Math.round(bitmap.width * scale), h = Math.round(bitmap.height * scale);
  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, w, h);       // flatten transparency for JPEG
  ctx.drawImage(bitmap, 0, 0, w, h);
  bitmap.close && bitmap.close();
  const blob = await new Promise(r => canvas.toBlob(r, "image/jpeg", JPEG_Q));

  // keep the original if shrinking somehow made it bigger and it was already small
  if (blob && (blob.size < file.size || file.size > 400000 || !/\.jpe?g$/i.test(file.name))){
    out.blob = blob; out.after = blob.size; out.converted = true;
  } else {
    out.blob = file; out.after = file.size;
  }
  out.w = w; out.h = h;
  out.url = URL.createObjectURL(out.blob);
  return out;
}

/* ---------- reading the repo ---------- */
const BAND_RE = /^(\d+)-(\d+)$/;
const IMG_RE = /\.(jpe?g|jfif|png|webp|avif|gif|svg|heic|heif|tiff?|bmp)$/i;

/* every category and band folder that exists, even the empty ones */
function folderShape(){
  const cats = new Map();
  const note = slug => { if (slug && !cats.has(slug)) cats.set(slug, true); };
  TREE.forEach(n => { const p = n.path.split("/"); if (p.length >= 3) note(p[1]); });
  LOCAL.folders.forEach(f => { const p = f.split("/"); if (p.length >= 2) note(p[1]); });
  return cats;
}

const titleish = s => s.split(/[-_]/).map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
const rupees = n => "₹" + Number(n).toLocaleString("en-IN");
const bandLabel = b => { const m = BAND_RE.exec(b); return m ? rupees(m[1]) + " – " + rupees(m[2]) : b; };

}

  const cat = (isLocal() ? LOCAL.catalogue : GH_CATALOGUE) || {categories: []};
  const out = [];
  (cat.categories || []).forEach(c => (c.products || []).forEach(p => out.push({...p, cat: c.slug})));
  return out;
}

    const files = [...fileList].filter(f => /^(image|video)\//.test(f.type) || /\.(heic|heif|tiff?|bmp|mp4|mov|webm|m4v)$/i.test(f.name));

        if (separate()) { say("A video belongs to one piece — " + f.name + " was skipped. Switch to \u201cOne piece, several photographs\u201d if you want it.", "wa"); continue; }

      ? "Drop every piece's photograph here" : "Drop this product's photographs here";
    $("#drop-hint").textContent = many
      ? "or click to choose · one photograph per piece · no video in this mode"
      : "or click to choose · every angle you have · one video is welcome too";
    $("#u-titlehint").textContent = many
      ? "used for all of them, numbered 1, 2, 3 — or leave it blank"
      : "leave it blank and we number it for you";
    $("#file").accept = many ? "image/*,.heic,.heif" : "image/*,video/*,.heic,.heif";
    if (many && QUEUE.some(x => x.kind === "video")){
      QUEUE = QUEUE.filter(x => x.kind !== "video");
      say("A video belongs to one piece, so it was taken out of the queue.", "wa");
    }
    paint();
  }
  document.querySelectorAll("input[name=umode]").forEach(r => r.onchange = applyMode);

  function paint(){
    const q = $("#queue"); q.innerHTML = "";
    QUEUE.forEach((it, i) => {
      const card = el("div", "qitem" + (it.kind === "video" ? " isvideo" : ""));
      const idx = QUEUE.filter(x => x.kind !== "video").indexOf(it);
      const first = it.kind !== "video" && idx === 0 && !separate();
      card.innerHTML = `${it.kind === "video"
          ? `<video src="${it.url}" muted playsinline></video>`
          : (it.url ? `<img src="${it.url}" alt="">` : `<div style="aspect-ratio:4/5;display:grid;place-items:center;color:var(--ink-2);font-size:.8rem">no preview</div>`)}
        ${first ? `<span class="badge">cover</span>` : ""}
        ${separate() && it.kind !== "video" ? `<span class="badge">piece ${idx + 1}</span>` : ""}
        ${it.kind === "video" ? `<span class="badge">video</span>` : ""}
        <div class="meta"><b>${esc(it.name)}</b>${kb(it.before)}${it.converted ? ` → <span class="saved">${kb(it.after)}</span>` : ""}</div>
        <button class="x" title="Remove">×</button>
        ${it.kind !== "video" && !separate() ? `<div class="nudge"><button data-up title="Move earlier">↑</button><button data-down title="Move later">↓</button></div>` : ""}`;
      card.querySelector(".x").onclick = () => { QUEUE.splice(i, 1); paint(); };
      const up = card.querySelector("[data-up]"), down = card.querySelector("[data-down]");
      if (up)   up.onclick   = () => { if (i > 0){ [QUEUE[i-1], QUEUE[i]] = [QUEUE[i], QUEUE[i-1]]; paint(); } };
      if (down) down.onclick = () => { if (i < QUEUE.length - 1){ [QUEUE[i+1], QUEUE[i]] = [QUEUE[i], QUEUE[i+1]]; paint(); } };
      q.appendChild(card);
    });
    const images = QUEUE.filter(x => x.kind !== "video").length;
    const video = QUEUE.some(x => x.kind === "video");
    const after = QUEUE.reduce((a, x) => a + x.after, 0);
    $("#u-tally").textContent = QUEUE.length
      ? (separate()
          ? `${images} photograph${images === 1 ? "" : "s"} → ${images} separate product${images === 1 ? "" : "s"} · ${kb(after)}`
          : `${images} photograph${images === 1 ? "" : "s"}${video ? " and a video" : ""} · one product · ${kb(after)}`)
      : "";
    const label = separate() ? `${isLocal() ? "Save" : "Commit"} ${images || ""} product${images === 1 ? "" : "s"}`.replace(/\s+/g, " ")
                             : (isLocal() ? "Save the product" : "Commit the product");
    $("#u-commit").textContent = label;
    $("#u-commit").disabled = !images;
    $("#u-clear").disabled = !QUEUE.length;
  }

  $("#u-clear").onclick = () => { QUEUE = []; paint(); logBox.innerHTML = ""; };

  $("#u-commit").onclick = async () => {
    const cat = (catSel.value === "__new" ? $("#u-catnew").value : catSel.value).trim().toLowerCase().replace(/\s+/g, "-");
    const price = parseInt($("#u-price").value.replace(/\D/g, ""), 10);
    const title = $("#u-title").value.trim();
    const many = separate();
    const sizes = readSizes();
    const qty = $("#u-qty").value.replace(/\D/g, "");
    logBox.innerHTML = "";
    if (!cat) { say("Which category?", "wa"); return; }
    if (!Number.isFinite(price) || price < 1) { say("Give the price as a plain number, e.g. 2300.", "wa"); return; }

    const btn = $("#u-commit"); btn.disabled = true;
    btn.innerHTML = `<span class="spin"></span> ${isLocal() ? "Saving" : "Committing"}`;
    try {
      if (isLocal()){
        const files = [];
        for (const q of QUEUE) files.push({kind: q.kind, ext: q.ext, b64: await toBase64(q.blob)});
        const data = await localPost("/api/product", {category: cat, price, title, files,
                                                     separate: many, sizes, qty});
        const made = data.createdAll || [data.created];
        if (made.length > 1) {
          say(`saved ${made.length} products`, "ok");
          made.forEach(f => say(f));
        } else {
          say(`saved as ${made[0]}`, "ok");
        }
        const link = say("");
        link.innerHTML = `${made.length > 1 ? "They show" : "It shows"} ${bandPhrase(price).replace(bandLabelFor(price), "<b>" + bandLabelFor(price) + "</b>")}. Refresh <a href="/" target="_blank" rel="noopener">the shop</a> to see ${made.length > 1 ? "them" : "it"}.`;
      } else {
        const safe = title.replace(/[\\/:*?"<>|]/g, " ").replace(/\s+/g, " ").trim();
        const taken = new Set(TREE.map(t => t.path));
        const freeFolder = base => {
          let f = base, n = 2;
          while ([...taken].some(p => p.startsWith(f + "/"))) f = `${base} (${n++})`;
          taken.add(f + "/");
          return f;
        };
        const adds = []; const made = [];
        if (many) {
          QUEUE.filter(q => q.kind !== "video").forEach((q, i) => {
            const base = `photos/${cat}/${price}${safe ? " " + safe + " " + (i + 1) : ""}`;
            const folder = safe ? base : freeFolder(base);
            made.push(folder);
            adds.push({path: `${folder}/1${q.ext}`, blob: q.blob});
            adds.push({path: `${folder}/stock.json`, blob: stockBlob(sizes, qty)});
          });
        } else {
          const folder = `photos/${cat}/${price}${safe ? " " + safe : ""}`;
          made.push(folder);
          let n = 1;
          for (const q of QUEUE) adds.push({path: q.kind === "video" ? `${folder}/video${q.ext}` : `${folder}/${n++}${q.ext}`, blob: q.blob});
          adds.push({path: `${folder}/stock.json`, blob: stockBlob(sizes, qty)});
        }
        const sha = await commitChanges(
          many ? `Add ${made.length} ${cat} pieces at ₹${price}` : `Add ${title || cat} at ₹${price}`, adds, []);
        say(`committed ${sha.slice(0, 7)} — ${made.length > 1 ? made.length + " products" : "the product is in " + made[0]}`, "ok");
        const link = say("");
        link.innerHTML = `<a href="https://github.com/${esc(CFG.owner)}/${esc(CFG.repo)}/actions" target="_blank" rel="noopener">Watch the catalogue rebuild →</a>`;
      }
      QUEUE = []; paint();
      $("#u-price").value = ""; $("#u-title").value = ""; $("#u-qty").value = "";
      $("#u-min").value = ""; $("#u-max").value = "";
      sizeSummary();
      $("#u-band").textContent = "the band is worked out from this";
      await loadTree();
    } catch (e) { say(e.message, "er"); }
    paint();
  };

  applyMode();
}

const bandLabelFor = price => {
  const low = Math.max(0, Math.floor(price / 1000) * 1000);
  return low === 0 ? "under ₹1,000" : `₹${low.toLocaleString("en-IN")} – ₹${(low + 1000).toLocaleString("en-IN")}`;
};
/* "under ₹1,000" already carries its own preposition; the other bands need one. */
const bandPhrase = price => (Math.floor(price / 1000) === 0 ? "" : "in ") + bandLabelFor(price);

/* ---------- manage ---------- */
async function renderManage(){
  const box = $("#tab-manage");
  if (isHosted() && HOSTED.why){ box.innerHTML = noTokenCard("save a change"); return; }
  if (!ready()){
    box.innerHTML = `<div class="card"><h2>Not connected yet</h2>
      <p class="sub">Add your repository and token under Settings first.</p>
      <button class="btn" onclick="go('settings')">Open settings</button></div>`;
    return;
  }
  box.innerHTML = `<div class="card"><h2>Everything in the shop</h2>
    <p class="sub">Change a price or a name, add more views, or delete a product. ${isLocal() ? "Changes are written into the folder straight away." : "Each action is one commit."}</p>
    <div class="log" id="m-log"></div></div>
    <div class="mlayout">
      <aside class="mfilters" id="m-filters" hidden></aside>
      <div id="m-body"><div class="empty"><span class="spin"></span> reading…</div></div>
    </div>`;
  logBox = $("#m-log");

  try {
    await loadTree();
    if (!isLocal()){
      const res = await fetch(`${API}${repoPath()}/contents/photos/catalogue.json?ref=${encodeURIComponent(CFG.branch)}`,
        {headers: {"Authorization": "Bearer " + CFG.token, "Accept": "application/vnd.github.raw"}});
      GH_CATALOGUE = res.ok ? await res.json() : {categories: []};
    }
  } catch (e) {
    $("#m-body").innerHTML = `<div class="card"><p>${esc(e.message)}</p></div>`; return;
  }

  /* The catalogue is rebuilt by the GitHub Action a minute or so after a
     commit, so for that minute it still lists a piece you have just deleted —
     and its card comes up blank, because the photographs really are gone.
     TREE is the repository's actual file list, read fresh a moment ago, so it
     is the honest answer. Anything with no files left is not shown. */
  const all = allProducts();
  MPRODUCTS = TREE.length
    ? all.filter(p => !p.folder || TREE.some(n => n.path.startsWith(p.folder + "/")))
    : all;
  MGONE = all.length - MPRODUCTS.length;
  paintManage();
}

/* Which categories are being shown, and what is being searched for. Kept out
   here so that deleting a piece — which paints the tab again — does not throw
   away what you had narrowed it down to. */
let MPRODUCTS = [];
let MGONE = 0;                  // deleted, but the catalogue has not caught up
const MFILTER = new Set();      // empty means everything
let MSEARCH = "";

function paintManage(){
  const products = MPRODUCTS;
  const side = $("#m-filters"), body = $("#m-body");
  if (!side || !body) return;
  body.innerHTML = "";

  if (!products.length){
    side.hidden = true;
    body.innerHTML = `<div class="empty">Nothing yet. Use the <b>Add a product</b> tab.</div>`;
    return;
  }

  /* Down the left, the same idea as the shop: every category that has
     something in it, with how many, and nothing that would show you nothing. */
  const tally = new Map();
  products.forEach(p => tally.set(p.cat, (tally.get(p.cat) || 0) + 1));
  const cats = [...tally.keys()].sort();
  for (const c of [...MFILTER]) if (!tally.has(c)) MFILTER.delete(c);

  side.hidden = false;
  side.innerHTML = `
    <div>
      <h4>Category</h4>
      ${cats.map(c => `<label><input type="checkbox" data-cat="${esc(c)}" ${
        MFILTER.has(c) ? "checked" : ""}> ${esc(titleish(c))}
        <span class="tally">${tally.get(c)}</span></label>`).join("")}
    </div>
    <div>
      <h4>Find one</h4>
      <input class="msearch" id="m-search" type="search" placeholder="code or name"
             value="${esc(MSEARCH)}" autocomplete="off">
    </div>
    <button class="clear" type="button" id="m-clear" ${
      MFILTER.size || MSEARCH ? "" : "hidden"}>Show everything</button>`;

  side.querySelectorAll("[data-cat]").forEach(cb => {
    cb.onchange = () => {
      cb.checked ? MFILTER.add(cb.dataset.cat) : MFILTER.delete(cb.dataset.cat);
      paintManage();
    };
  });
  const search = side.querySelector("#m-search");
  search.oninput = () => {
    MSEARCH = search.value;
    clearTimeout(search._t);
    search._t = setTimeout(() => {
      const at = search.selectionStart;
      paintManage();
      const again = $("#m-search");
      if (again) { again.focus(); try { again.setSelectionRange(at, at); } catch (e) {} }
    }, 220);
  };
  side.querySelector("#m-clear").onclick = () => { MFILTER.clear(); MSEARCH = ""; paintManage(); };

  const needle = MSEARCH.trim().toLowerCase();
  const shown = products.filter(p =>
    (!MFILTER.size || MFILTER.has(p.cat)) &&
    (!needle || (p.code + " " + (p.title || "")).toLowerCase().includes(needle)));

  body.innerHTML = `<p class="mcount">${shown.length} of ${products.length} piece${
    products.length === 1 ? "" : "s"}${
    MFILTER.size || needle ? "" : " · everything"}${MGONE ? `
    <span style="color:var(--warn)">· ${MGONE} just deleted, waiting for the
    catalogue to rebuild</span>` : ""}</p>`;

  if (!shown.length){
    body.insertAdjacentHTML("beforeend",
      `<div class="empty">Nothing matches that. <b>Show everything</b> is on the left.</div>`);
    return;
  }

  const byCat = new Map();
  shown.forEach(p => { if (!byCat.has(p.cat)) byCat.set(p.cat, []); byCat.get(p.cat).push(p); });

  [...byCat.keys()].sort().forEach(cat => {
    const list = byCat.get(cat).sort((a, b) => a.price - b.price);
    const head = el("div", "groupname");
    head.innerHTML = `<h3>${esc(titleish(cat))}</h3><span>${list.length} product${list.length === 1 ? "" : "s"}</span>`;
    body.appendChild(head);

    const grid = el("div", "pieces");
    list.forEach(p => {
      const views = (p.images || []).length + (p.video ? 1 : 0);
      const card = el("div", "piece");
      card.innerHTML = `<div class="shot">${views > 1 ? `<span class="n">${views} views</span>` : ""}</div>
        <div class="body">
          <code>${esc(p.code)}</code>
          <div class="ttl">${esc(p.title || titleish(cat) + " " + String(p.n).padStart(2, "0"))}</div>
          <div class="band">₹${Number(p.price).toLocaleString("en-IN")} · ${bandLabelFor(p.price)}</div>
          <div class="acts">
            <button class="btn ghost sm" data-edit>Price / name</button>
            <button class="btn ghost sm" data-more>Add views</button>
            <button class="btn danger sm" data-del>Delete</button>
          </div>
        </div>`;
      const shot = card.querySelector(".shot");
      if ((p.images || []).length) thumb(p.images[0]).then(u => { const i = el("img"); i.src = u; i.alt = p.code; shot.prepend(i); }).catch(() => {});

      const delBtn = card.querySelector("[data-del]");
      const label = p.title ? `${p.code} — ${p.title}` : p.code;

      if (isLocal()) {
        /* Straight to the trash. No dialog: the bar at the bottom carries the undo. */
        delBtn.onclick = async () => {
          card.classList.add("going");
          try {
            const res = await localPost("/api/delete", {folders: [p.folder]});
            snack(`${label} moved to the trash`, async () => {
              await localPost("/api/undelete", {undo: res.undo});
              snack(`${label} is back`);
              renderManage();
            });
            renderManage();
          } catch (e) {
            card.classList.remove("going");
            snack(e.message);
          }
        };
      } else {
        /* On GitHub a delete is a commit, so there is nothing to move back.
           The button asks once, in place, instead of throwing up a dialog. */
        let armed = null;
        delBtn.onclick = async () => {
          if (!armed) {
            delBtn.textContent = "Sure?";
            delBtn.classList.add("armed");
            armed = setTimeout(() => {
              armed = null; delBtn.textContent = "Delete"; delBtn.classList.remove("armed");
            }, 4000);
            return;
          }
          clearTimeout(armed); armed = null;
          card.classList.add("going");
          try {
            const files = TREE.filter(n => n.path.startsWith(p.folder + "/")).map(n => n.path);
            await commitChanges(`Remove ${p.code}`, [], files);
            snack(`${label} removed — the files are still in your git history`);
            renderManage();
          } catch (e) {
            card.classList.remove("going");
            delBtn.textContent = "Delete"; delBtn.classList.remove("armed");
            snack(e.message);
          }
        };
      }

      card.querySelector("[data-edit]").onclick = async () => {
        if (!isLocal()) { alert("Changing a price renames the folder — do that with the studio running on your computer."); return; }
        const price = prompt(`New price for ${p.code}, in rupees:`, String(p.price));
        if (price === null) return;
        const n = parseInt(String(price).replace(/\D/g, ""), 10);
        if (!Number.isFinite(n) || n < 1) { alert("Give the price as a plain number, e.g. 2300."); return; }
        const title = prompt("Name (leave empty for none):", p.title || "");
        if (title === null) return;
        try {
          logBox.innerHTML = "";
          say(`updating ${p.code}…`);
          await localPost("/api/product/edit", {folder: p.folder, price: n, title});
          say(`${p.code} is now ₹${n.toLocaleString("en-IN")} — ${bandLabelFor(n)}. Its code did not change.`, "ok");
          renderManage();
        } catch (e) { say(e.message, "er"); }
      };

      card.querySelector("[data-more]").onclick = () => {
        const input = document.createElement("input");
        input.type = "file"; input.accept = "image/*,.heic,.heif"; input.multiple = true;
        input.onchange = async () => {
          try {
            logBox.innerHTML = "";
            const files = [];
            for (const f of input.files){
              const done = await shrink(f);
              files.push({kind: "image", ext: done.converted ? ".jpg" : "." + f.name.split(".").pop().toLowerCase(),
                          b64: await toBase64(done.blob)});
              say(`${f.name} ${kb(done.before)} → ${kb(done.after)}`);
            }
            if (!files.length) return;
            if (isLocal()) await localPost("/api/product/files", {folder: p.folder, files});
            else {
              const used = TREE.filter(n => n.path.startsWith(p.folder + "/")).length;
              const adds = files.map((f, i) => ({path: `${p.folder}/${used + i + 1}${f.ext}`, blob: dataToBlob(f.b64)}));
              await commitChanges(`More views for ${p.code}`, adds, []);
            }
            say(`${files.length} view${files.length === 1 ? "" : "s"} added to ${p.code}`, "ok");
            renderManage();
          } catch (e) { say(e.message, "er"); }
        };
        input.click();
      };

      grid.appendChild(card);
    });
    body.appendChild(grid);
  });
}

function dataToBlob(b64){
  const bin = atob(b64), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr]);
}

/* ---------- commit and push ---------- */
let GIT = null;
async function refreshGit(){
  const bar = $("#gitbar");
  if (!isLocal()){ bar.hidden = true; return; }
  try {
    const res = await fetch("/api/git", {cache:"no-store"});
    if (!res.ok) throw new Error();
    GIT = await res.json();
  } catch (e) { bar.hidden = true; return; }

  bar.hidden = false;
  const dot = $("#gitDot"), what = $("#gitWhat"), btn = $("#gitPush"), toggle = $("#gitToggle");
  const pending = (GIT.changes || []).length;
  const ahead = GIT.ahead || 0;

  if (!GIT.installed || !GIT.repo){
    dot.className = "dot"; what.textContent = GIT.note || "not a git repository";
    btn.disabled = true; toggle.hidden = true; $("#gitDetail").hidden = true;
    return;
  }

  const bits = [];
  if (pending) bits.push(`${pending} change${pending === 1 ? "" : "s"} to commit`);
  if (ahead)   bits.push(`${ahead} commit${ahead === 1 ? "" : "s"} to push`);
  what.textContent = bits.length ? bits.join(" · ") : "everything is pushed";
  if (!GIT.remote) what.textContent += " · " + GIT.note;
  dot.className = "dot " + (pending || ahead ? "pending" : "clean");
  btn.disabled = !(pending || ahead) || !GIT.remote;
  toggle.hidden = !pending;
  const box = $("#gitDetail");
  if (!pending && !box.dataset.keep) box.hidden = true;
}

$("#gitToggle").onclick = () => {
  const box = $("#gitDetail");
  delete box.dataset.keep;
  box.hidden = !box.hidden;
  if (!box.hidden){
    box.innerHTML = (GIT.changes || []).map(c =>
      `<div><code>${esc(c.status)}</code> ${esc(c.path)}</div>`).join("")
      || "<div>nothing</div>";
  }
};

$("#gitPush").onclick = async () => {
  const btn = $("#gitPush"), what = $("#gitWhat");
  const message = $("#gitMsg").value.trim() || "Update photographs";
  btn.disabled = true; btn.innerHTML = `<span class="spin"></span> Pushing`;
  what.textContent = "committing and pushing…";
  try {
    const res = await fetch("/api/git", {method:"POST", headers:{"Content-Type":"application/json"},
                                         body: JSON.stringify({message})});
    let data = null; try { data = await res.json(); } catch (e) {}
    if (!res.ok || (data && data.error)) throw new Error((data && data.error) || `the studio server said ${res.status}`);
    $("#gitMsg").value = "";
    const box = $("#gitDetail"); box.hidden = false; box.dataset.keep = "1";
    box.innerHTML = (data.log || []).map(l => `<div>${esc(l)}</div>`).join("")
      + (data.pushed ? `<div style="color:var(--ok);margin-top:6px">pushed — Cloudflare is deploying, live in about a minute</div>` : "");
  } catch (e) {
    const box = $("#gitDetail"); box.hidden = false; box.dataset.keep = "1";
    box.innerHTML = `<div style="color:var(--bad);white-space:pre-wrap">${esc(e.message)}</div>`;
  }
  btn.textContent = "Commit & push";
  await refreshGit();
};

/* ---------- tabs ---------- */
function stamp(){
  $("#repoLabel").textContent = isLocal()
    ? "this computer · " + (LOCAL.root.split(/[\\/]/).pop() || "folder")
    : (ready() ? `${CFG.owner}/${CFG.repo} · ${CFG.branch}` : "not connected");
  $("#repoLabel").title = isLocal() ? LOCAL.root : "";
}
function go(name){
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.tab === name));
  ["upload","manage","settings"].forEach(n => { $("#tab-" + n).hidden = n !== name; });
  logBox = null;
  if (name === "upload") renderUpload();
  if (name === "manage") renderManage();
  if (name === "settings") renderSettings();
  refreshGit();
  location.hash = name;
}
document.querySelectorAll(".tab").forEach(t => t.onclick = () => go(t.dataset.tab));

/* ---------- boot ---------- */
(async () => {
  /* The studio server on this computer wins if it is there, because that is
     the fastest way to work. Otherwise, if the site itself is serving this
     page and holds a token, we use that. A personal token is the last resort. */
  const found = await detectLocal();
  let saved = "";
  try { saved = localStorage.getItem("qala.mode") || ""; } catch (e) {}

  if (found) {
    MODE = saved === "github" ? "github" : "local";
  } else if (await detectHosted()) {
    MODE = "hosted";
    API = "/office/gh";           // our own worker, which holds the key
  } else {
    MODE = "github";
    /* Signed in but the site has no token set yet — say so rather than
       quietly asking for a personal one. */
    if (HOSTED.available && HOSTED.why) {
      MODE = "hosted"; API = "/office/gh";
    }
  }
  /* A studio with nothing behind it would otherwise just look empty — no
     categories, no pieces — and leave you wondering what broke. */
  if (isHosted() && HOSTED.why) {
    const box = document.getElementById("nowhere");
    box.hidden = false;
    box.innerHTML = `<div class="box">
      <h2>Nothing to show yet</h2>
      <p>${esc(HOSTED.why)}</p>
      <p>Until then this studio cannot read the pieces or write any, so the
         categories are empty. Nothing is broken.</p>
      <p><b>To work on the shop right now:</b> run <code>preview.bat</code> and open
         <code>http://localhost:8000/studio/</code>. That writes straight into the
         folder on this computer and needs no token at all.</p>
    </div>`;
  }

  if (isHosted()) {
    const nav = document.getElementById("crossnav");
    if (nav) {
      nav.hidden = false;
      document.getElementById("signOut").onclick = async () => {
        try { await fetch("/office/logout", {method:"POST", credentials:"same-origin"}); } catch (e) {}
        location.href = "/office/";
      };
    }
  }
  stamp();
  const start = ["upload","manage","settings"].includes(location.hash.slice(1)) ? location.hash.slice(1)
              : (ready() ? "upload" : "settings");
  if (ready() && !isLocal() && !(isHosted() && HOSTED.why)){
    try { await loadTree(); } catch (e) { /* the tab will report it */ }
  }
  go(start);
})();
</script>
